version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      app-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /apps/cloud
    schedule:
      interval: weekly
    groups:
      cloud-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
