name: Product proposal
description: Propose a user-visible improvement
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the situation on Steam Deck and what gets in the player's way.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result rather than a particular implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation
      description: How could we verify this on real hardware?

