name: Bug report
description: Report behavior that can be reproduced in Afterglide
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Afterglide dependable on Steam Deck.
  - type: input
    id: version
    attributes:
      label: Afterglide version or commit
      placeholder: v0.1.0 or a commit hash
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Steam Deck LCD
        - Steam Deck OLED
        - Other Linux handheld
        - Desktop Linux
        - macOS development build
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the action, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |-
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: SteamOS version, Gaming/Desktop Mode, network type, and console model when relevant.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, account details, console identifiers, IP addresses, and other private data.
          required: true

