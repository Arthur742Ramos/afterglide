name: Cloud unsigned candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Unsigned Cloud (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/cloud
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/cloud/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high
      - run: npx playwright test
      - name: Build Windows test installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Check Windows candidate signature status
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release/Afterglide-Cloud-$version-win-x64.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected an unsigned test installer; inspect the build before using it."
          }
          Write-Output "Unsigned test installer confirmed. Clean-machine installation remains unqualified."
      - name: Build Mac test images
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg zip --arm64 --publish never --config.mac.identity=null --config.mac.notarize=false
      - name: Check packaged libraries and attribution
        # Packaging can succeed with incomplete dependencies; load the archive first.
        run: node scripts/check-packaged-runtime.mjs
      - name: Assemble candidate payload
        run: node scripts/candidate-artifacts.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Retain unsigned candidate for qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cloud-unsigned-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: apps/cloud/artifacts/candidate/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cloud-candidate-failure-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            apps/cloud/test-results
            apps/cloud/playwright-report
          if-no-files-found: ignore
          retention-days: 7
