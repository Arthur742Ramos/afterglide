name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Verify, package, and publish Linux artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Match the release tag to package.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          if (`v${version}` !== process.env.RELEASE_TAG) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${version}.`);
          }
          NODE
      - run: npm run format:check
      - run: npm run check:installer
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Run desktop journeys
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: Build AppImage and tarball
        run: npm run package:linux
      - name: Assemble checksummed release assets
        run: |
          cp packaging/install-steam-deck.sh release/install-steam-deck.sh
          cp data/icons/hicolor/scalable/apps/io.github.Arthur742Ramos.Afterglide.svg \
            release/io.github.Arthur742Ramos.Afterglide.svg
          chmod 0755 release/install-steam-deck.sh
          cd release
          sha256sum \
            Afterglide-*.AppImage \
            Afterglide-*.tar.gz \
            install-steam-deck.sh \
            io.github.Arthur742Ramos.Afterglide.svg \
            > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Retain the exact release payload
        uses: actions/upload-artifact@v7
        with:
          name: afterglide-${{ github.ref_name }}-linux-x64
          path: |
            release/Afterglide-*.AppImage
            release/Afterglide-*.tar.gz
            release/install-steam-deck.sh
            release/io.github.Arthur742Ramos.Afterglide.svg
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          assets=(
            release/Afterglide-*.AppImage
            release/Afterglide-*.tar.gz
            release/install-steam-deck.sh
            release/io.github.Arthur742Ramos.Afterglide.svg
            release/SHA256SUMS
          )
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            exit 0
          fi
          arguments=(
            "${RELEASE_TAG}"
            "${assets[@]}"
            --verify-tag
            --title "Afterglide ${RELEASE_TAG}"
            --notes-file CHANGELOG.md
          )
          if [[ "${version}" == *-* ]]; then
            arguments+=(--prerelease)
          fi
          gh release create "${arguments[@]}"
