name: Cloud desktop checks
on:
  push:
    branches: [main]
    paths: &cloud_paths
      - "apps/cloud/**"
      - "src/renderer/stream/**"
      - "src/renderer/recovery.ts"
      - "src/shared/**"
      - "src/main/performance-report.ts"
      - "src/main/device-metrics.ts"
      - ".github/workflows/cloud-ci.yml"
  pull_request:
    paths: *cloud_paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: Cloud (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/cloud/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npx prettier --check ../../.github/workflows/cloud-ci.yml
      - run: npm audit --audit-level=high
      - run: npx playwright test
      - run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: cloud-evidence-${{ matrix.os }}
          path: |
            apps/cloud/test-results
            apps/cloud/playwright-report
          if-no-files-found: ignore
          retention-days: 7
